name: CI

# Mirrors the checks of scripts/verify-brse.sh that need no running stack:
# backend (ruff + pytest on SQLite), frontend (typecheck, eslint, vitest) and the shared API contract.
# Not covered here on purpose: Docker build, live AI runtime (9router/Ollama) and Chrome Extension
# smoke tests; run `bash scripts/verify-brse.sh` locally for those.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (ruff + pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: System libraries used by the backend (PDF export, media, OCR)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg tesseract-ocr libpango-1.0-0 libpangoft2-1.0-0
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt ruff==0.15.14
      - name: Ruff
        run: python -m ruff check app tests
      - name: Pytest
        run: python -m pytest -q

  frontend:
    name: Frontend (typecheck + eslint + vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: ESLint
        run: npm run lint
      - name: Vitest
        run: npm test

  mcp-server:
    name: MCP server (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: mcp-server/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: python -m pytest -q

  api-contract:
    name: Shared API contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/check-api-contract.cjs
