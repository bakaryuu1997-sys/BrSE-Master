<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>BrSE OS Assistant</title>
    <link rel="stylesheet" href="../../shared/tokens.css" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body class="brse-popup">
    <header>
      <div class="logo">BrSE <span data-i18n="extName">OS</span></div>
      <div id="connection-dot" title="Backend connection"></div>
    </header>

    <div class="tabs">
      <button class="tab-btn active" data-tab="todos" data-i18n="dashboardTab">Dashboard</button>
      <button class="tab-btn" data-tab="settings" data-i18n="settingsTab">Settings</button>
    </div>

    <main class="content-area">
      <section id="tab-todos">
        <div class="section-title" data-i18n="hubTitle">Quick actions</div>
        <div class="hub-grid">
          <button class="hub-btn" id="hub-palette" type="button">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="4 17 10 11 4 5"/><line x1="12" y1="19" x2="20" y2="19"/></svg>
            <span data-i18n="hubPalette">Command palette</span>
          </button>
          <button class="hub-btn" id="hub-ocr" type="button">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7V5a2 2 0 0 1 2-2h2"/><path d="M17 3h2a2 2 0 0 1 2 2v2"/><path d="M21 17v2a2 2 0 0 1-2 2h-2"/><path d="M7 21H5a2 2 0 0 1-2-2v-2"/><line x1="7" y1="12" x2="17" y2="12"/></svg>
            <span data-i18n="hubOcr">Region OCR</span>
          </button>
          <button class="hub-btn" id="hub-sidepanel" type="button">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="15" y1="3" x2="15" y2="21"/></svg>
            <span data-i18n="hubSidepanel">Open sidepanel</span>
          </button>
          <button class="hub-btn" id="hub-webapp" type="button">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
            <span data-i18n="hubWebApp">Open web app</span>
          </button>
        </div>

        <div class="hub-toggles">
          <button class="hub-toggle" id="hub-glossary" type="button" aria-pressed="true">
            <span class="hub-toggle-dot"></span>
            <span data-i18n="hubGlossary">Glossary highlight</span>
          </button>
          <button class="hub-toggle" id="hub-keigo" type="button" aria-pressed="true">
            <span class="hub-toggle-dot"></span>
            <span data-i18n="hubKeigo">Keigo check</span>
          </button>
          <button class="hub-toggle" id="hub-furigana" type="button" aria-pressed="true" style="grid-column:span 2">
            <span class="hub-toggle-dot"></span>
            <span data-i18n="hubFurigana">Dịch di chuột (Alt+hover)</span>
          </button>
        </div>

        <div class="section-title" data-i18n="urgentFocusTitle">
          Urgent focus
          <span id="todo-count">0</span>
        </div>
        <div id="todo-list" class="todo-list">
          <p class="status-msg text-muted" data-i18n="loadingText">Loading...</p>
        </div>
      </section>

      <section id="tab-settings" style="display: none;">
        <div class="section-title" data-i18n="activeModelLabel">AI Model</div>
        <div class="form-group">
          <label data-i18n="activeModelLabel">Active model</label>
          <select id="aiModel" class="field-control" style="width: 100%;">
            <!-- Populated at runtime from shared/modelConfig.js (single source of truth). -->
            <option value="openrouter/nvidia/nemotron-3-super-120b-a12b:free">🤖 Nemotron 3 Super Free</option>
          </select>
        </div>

        <div class="section-title" style="margin-top: 20px;" data-i18n="localBridgeTitle">Local bridge</div>
        <div class="form-group">
          <label data-i18n="secretTokenLabel">Secret token</label>
          <input type="password" id="secretToken" data-i18n-placeholder="secretTokenPlaceholder" placeholder="Required only when BRSE_API_SECRET is set" />
        </div>
        <div class="form-group">
          <label data-i18n="apiUrlLabel">API URL</label>
          <input id="apiBaseUrl" placeholder="http://127.0.0.1:3010/api" />
        </div>

        <div class="form-group">
          <label style="display:flex;align-items:center;gap:8px;cursor:pointer;">
            <input type="checkbox" id="furiganaAlwaysOn" style="width:auto;" />
            <span data-i18n="furiganaAlwaysOnLabel">Luôn hiện furigana (không cần giữ Alt)</span>
          </label>
        </div>

        <button class="btn-primary" id="btn-save-config" data-i18n="saveSettingsBtn">Save settings</button>
        <p id="config-status" class="status-msg status-inline" role="status" aria-live="polite"></p>
        
        <div class="form-group glossary-settings-group">
          <label data-i18n="glossaryHighlightsLabel">Glossary Highlights</label>
          <div class="learned-actions">
            <button type="button" class="learned-toggle-btn" id="btn-show-learned" data-i18n="learnedCountBtn">📁 Từ đã ẩn (<span id="learned-count">0</span>)</button>
            <button type="button" class="learned-reset-btn" id="btn-reset-learned" data-i18n="unhideAllBtn">🔄 Bỏ ẩn tất cả</button>
          </div>
          <div id="learned-list-container" class="learned-list-box">
            <div id="learned-list" class="learned-list-grid"></div>
          </div>
        </div>
        
      </section>
    </main>

    <script type="module" src="./popup.js"></script>
  </body>
</html>
