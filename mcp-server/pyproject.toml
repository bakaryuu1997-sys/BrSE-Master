[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "brse-mcp"
version = "0.1.0"
description = "MCP server for BrSE OS (phase 1: read-only access through the REST API)"
requires-python = ">=3.10"
dependencies = [
    # mcp 2.x renamed FastMCP and changed the API; stay on 1.x until we migrate on purpose.
    "mcp>=1.9,<2",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[project.scripts]
brse-mcp = "brse_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src"]
